PACKAGE_NAME="sn8022"
PACKAGE_VERSION="0.2.1"
BUILT_MODULE_NAME[0]="snd-hda-codec-conexant"
DEST_MODULE_LOCATION[0]="/updates/dkms"
STRIP[0]="no"
AUTOINSTALL="yes"
BUILD_EXCLUSIVE_ARCH="^x86_64$"
BUILD_EXCLUSIVE_KERNEL="^7\.0\.0-34-generic$"
MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir}"
PRE_BUILD="check.py build ${kernelver}"
PRE_INSTALL="check.py before-install ${kernelver} ${arch} ${dkms_tree}"
POST_INSTALL="refresh-initramfs.sh ${kernelver}"
POST_REMOVE="refresh-initramfs.sh ${kernelver}"
